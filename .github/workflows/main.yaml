name: RBAC

on:
  push:
    branches: [ "dev" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Setup gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Granting rights for gradle
        run: chmod +x gradlew

      - name: Run build
        run: ./gradlew build

      - name: Run unit tests
        run: ./gradlew test

      - name: Run load tests
        if: success()
        run: ./gradlew loadTest
